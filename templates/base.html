<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Server monitoring{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="brand-kicker">Local demo</p>
        <h1>Server monitoring</h1>
      </div>
    </div>
    <p class="mode">Read only</p>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
